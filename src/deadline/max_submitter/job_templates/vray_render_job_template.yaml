specificationVersion: 'jobtemplate-2023-09'
name: VRay Standalone Render
parameterDefinitions:
- name: VRayExecutable
  type: STRING
  default: vray
  description: V-Ray Standalone executable
- name: VRSceneOutputPath
  type: PATH
  objectType: FILE
  dataFlow: IN
  description: The vrscene file to render
- name: OutputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  description: Output directory for rendered images
- name: OutputFileName
  type: STRING
  description: Output filename with extension
- name: Frames
  type: STRING
  description: Frame range to render
- name: RegionColumns
  type: INT
  description: Number of region columns
- name: RegionRows
  type: INT
  description: Number of region rows
- name: RenderEngine
  type: INT
  default: 0
  allowedValues: [0, 5, 7]
  description: 'V-Ray render engine: 0=CPU, 5=CUDA, 7=RTX'
- name: RTTimeout
  type: FLOAT
  default: 0.0
  description: RT engine frame timeout in minutes (0=no limit)
- name: RTNoise
  type: FLOAT
  default: 0.001
  description: RT engine noise threshold
- name: RTSampleLevel
  type: INT
  default: 0
  description: RT engine max samples per pixel (0=no limit)
steps:
- name: RenderVRScene
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: '{{Param.Frames}}'
  script:
    embeddedFiles:
    - name: SetupAndRender
      type: TEXT
      filename: setup_and_render.py
      data: INJECT_PATH_MAPPING_SCRIPT
    actions:
      onRun:
        command: python
        args:
        - '{{Task.File.SetupAndRender}}'
