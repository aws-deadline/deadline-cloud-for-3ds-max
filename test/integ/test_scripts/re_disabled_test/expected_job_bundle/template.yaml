specificationVersion: jobtemplate-2023-09
name: fog
description: null
parameterDefinitions:
- name: MaxSceneFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Max Scene File
    groupLabel: 3dsMax Settings
    fileFilters:
    - label: Max Scene Files
      patterns:
      - '*.max'
    - label: All Files
      patterns:
      - '*'
  description: The Max scene file to render.
- name: State01_Frames
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Frames
    groupLabel: State01 Settings
  description: The frames to render. E.g. 1-3,8,11-15
  minLength: 1
- name: State01_ImageHeight
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Image Height
    groupLabel: State01 Settings
  minValue: 1
  description: The image height of the output.
- name: State01_ImageWidth
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Image Width
    groupLabel: State01 Settings
  minValue: 1
  description: The image width of the output.
- name: State01_OutputFileFormat
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Output File Format
    groupLabel: State01 Settings
  description: The output file extension.
- name: State01_OutputFileName
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Output File Name
    groupLabel: State01 Settings
  description: The output file name.
- name: State01_OutputFilePath
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output File Path
    groupLabel: State01 Settings
  description: The render output path.
- name: StrictErrorChecking
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Strict Error Checking
    groupLabel: 3dsMax Settings
  description: Fail when errors occur.
  default: 'false'
  allowedValues:
  - 'true'
  - 'false'
- name: RenderElementsModified
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Modify Render Elements
    groupLabel: Render Elements
  description: Enable or disable modification of render elements settings.
  default: 'true'
  allowedValues:
  - 'true'
  - 'false'
- name: RenderElements
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Output Render Elements
    groupLabel: Render Elements
  description: Enable or disable render elements output.
  default: 'true'
  allowedValues:
  - 'true'
  - 'false'
- name: RenderElementsUpdatePaths
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Update Render Element Paths
    groupLabel: Render Elements
  description: Automatically update render element output paths based on naming settings.
  default: 'true'
  allowedValues:
  - 'true'
  - 'false'
- name: RenderElementsIncludeNameInPath
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Include Render Element Name in Path
    groupLabel: Render Elements
  description: Add render element name as subdirectory in output path.
  default: 'true'
  allowedValues:
  - 'true'
  - 'false'
- name: RenderElementsIncludeTypeInPath
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Include Render Element Type in Path
    groupLabel: Render Elements
  description: Add render element type as subdirectory in output path.
  default: 'false'
  allowedValues:
  - 'true'
  - 'false'
- name: RenderElementsIncludeNameInFilename
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Include Render Element Name in Filename
    groupLabel: Render Elements
  description: Add render element name to output filename.
  default: 'true'
  allowedValues:
  - 'true'
  - 'false'
- name: RenderElementsIncludeTypeInFilename
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Include Render Element Type in Filename
    groupLabel: Render Elements
  description: Add render element type to output filename.
  default: 'false'
  allowedValues:
  - 'true'
  - 'false'
- name: VRayRenderElementsVFBControl
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: V-Ray Render Elements VFB Control
    groupLabel: Render Elements
  description: Automatically control V-Ray VFB settings for render elements during
    rendering.
  default: 'true'
  allowedValues:
  - 'true'
  - 'false'
- name: VRaySplitBufferSupport
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: V-Ray Split Buffer Support
    groupLabel: Render Elements
  description: Enable V-Ray split buffer support for render elements.
  default: 'true'
  allowedValues:
  - 'true'
  - 'false'
- name: IgnoreRenderElementsByName
  type: STRING
  userInterface:
    control: DROPDOWN_LIST
    label: Ignore Render Elements by Name
    groupLabel: Render Elements
  description: List of render element names to ignore during rendering.
  default: ''
  allowedValues:
  - ''
  - MultiMatteElement
  - Alpha
  - Atmosphere
  - Background
  - Blend
  - Diffuse
  - Hair and Fur
  - Illuminance HDR Data
  - Ink
  - Lighting
  - Luminance HDR Data
  - Material ID
  - Matte
  - Object ID
  - Paint
  - Reflection
  - Refraction
  - Self-Illumination
  - Shadow
  - Specular
  - Velocity
  - Z Depth
steps:
- name: State01
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: '{{Param.State01_Frames}}'
    - name: Camera
      type: STRING
      range:
      - Camera01
  stepEnvironments:
  - name: 3ds Max
    description: Runs 3ds Max in the background.
    script:
      embeddedFiles:
      - name: initData
        filename: init-data.yaml
        type: TEXT
        data: |
          scene_file: {{Param.MaxSceneFile}}
          renderer: Default_Scanline_Renderer
          state_set: State01
          output_file_path: '{{Param.State01_OutputFilePath}}'
          output_file_name: '{{Param.State01_OutputFileName}}'
          output_file_format: '{{Param.State01_OutputFileFormat}}'
          image_width: '{{Param.State01_ImageWidth}}'
          image_height: '{{Param.State01_ImageHeight}}'
          enabled_modify_render_elements: '{{Param.RenderElementsModified}}'
          render_elements: '{{Param.RenderElements}}'
          render_elements_update_paths: '{{Param.RenderElementsUpdatePaths}}'
          render_elements_include_name_in_path: '{{Param.RenderElementsIncludeNameInPath}}'
          render_elements_include_type_in_path: '{{Param.RenderElementsIncludeTypeInPath}}'
          render_elements_include_name_in_filename: '{{Param.RenderElementsIncludeNameInFilename}}'
          render_elements_include_type_in_filename: '{{Param.RenderElementsIncludeTypeInFilename}}'
          vray_render_elements_vfb_control: '{{Param.VRayRenderElementsVFBControl}}'
          vray_split_buffer_support: '{{Param.VRaySplitBufferSupport}}'
          ignore_render_elements_by_name: '{{Param.IgnoreRenderElementsByName}}'
      - name: runStart
        filename: start.bat
        type: TEXT
        data: |
          3dsmax-openjd daemon start --connection-file {{Session.WorkingDirectory}}/connection.json --init-data file://{{Env.File.initData}}
      - name: runStop
        filename: stop.bat
        type: TEXT
        data: |
          3dsmax-openjd daemon stop --connection-file {{Session.WorkingDirectory}}/connection.json
      actions:
        onEnter:
          command: powershell
          args:
          - '{{Env.File.runStart}}'
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
          timeout: 87000
        onExit:
          command: powershell
          args:
          - '{{Env.File.runStop}}'
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
          timeout: 600
  script:
    actions:
      onRun:
        command: powershell
        args:
        - '{{Task.File.runRender}}'
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
    embeddedFiles:
    - name: runData
      filename: run-data.yaml
      type: TEXT
      data: |-
        frame: {{Task.Param.Frame}}
        camera: '{{Task.Param.Camera}}'
    - name: runRender
      filename: render.bat
      type: TEXT
      runnable: true
      data: |
        3dsmax-openjd daemon run --connection-file {{ Session.WorkingDirectory }}/connection.json --run-data file://{{Task.File.runData}}
