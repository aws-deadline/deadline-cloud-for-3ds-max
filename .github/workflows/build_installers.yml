name: Build Installers

on:
  workflow_dispatch:
    inputs:
      os:
        required: true
        default: Windows
        type: choice
        options:
        - Windows
      ref_type:
        required: true
        default: heads
        type: choice
        options:
        - tags
        - heads
      ref:
        required: true
        type: string
        default: mainline
      environment:
        required: true
        type: choice
        options:
        - mainline

jobs:
  # See the matching job in release_publish.yml: the installer build runs
  # scripts/deps_bundle.py, whose native merge assumes every filename shared by two Python
  # versions comes from an abi3 wheel. These tests resolve the real wheels to confirm it.
  VerifyNativeWheelNaming:
    if: (github.repository == 'aws-deadline/deadline-cloud-for-3ds-max')
    name: Verify Native Wheel Naming
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade hatch "click<8.3" "virtualenv<21"
      - name: Verify native wheel naming
        run: hatch run test-network

  BuildInstaller:
    needs: [VerifyNativeWheelNaming]
    if: (github.repository == 'aws-deadline/deadline-cloud-for-3ds-max')
    name: Build Installer
    uses: aws-deadline/.github/.github/workflows/reusable_build_installers.yml@mainline
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      environment: ${{inputs.environment}}
      ref_type: ${{inputs.ref_type}}
      ref: ${{inputs.ref}}
      oses: "['${{inputs.os}}']"
      project_name: deadline-cloud-for-3ds-max