steps:
- name: cam_only
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: '{{Param.B1_cam_only_Frames}}'
  stepEnvironments:
  - name: 3ds Max
    description: Runs 3ds Max in the background.
    script:
      embeddedFiles:
      - name: initData
        filename: init-data.yaml
        type: TEXT
        data: |
          scene_file: {{Param.MaxSceneFile}}
          renderer: Default_Scanline_Renderer
          camera: '{{Param.B1_cam_only_Camera}}'
          output_file_path: '{{Param.B1_cam_only_OutputFilePath}}'
          output_file_name: '{{Param.B1_cam_only_OutputFileName}}'
          output_file_format: '{{Param.B1_cam_only_OutputFileFormat}}'
          image_width: '{{Param.B1_cam_only_ImageWidth}}'
          image_height: '{{Param.B1_cam_only_ImageHeight}}'
      - name: runStart
        filename: start.bat
        type: TEXT
        data: |
          3dsmax-openjd daemon start --connection-file {{Session.WorkingDirectory}}/connection.json --init-data file://{{Env.File.initData}} --path-mapping-rules file://{{Session.PathMappingRulesFile}}
      - name: runStop
        filename: stop.bat
        type: TEXT
        data: |
          3dsmax-openjd daemon stop --connection-file {{Session.WorkingDirectory}}/connection.json
      actions:
        onEnter:
          command: powershell
          args:
          - '{{Env.File.runStart}}'
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
          timeout: 87000
        onExit:
          command: powershell
          args:
          - '{{Env.File.runStop}}'
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
          timeout: 600
  script:
    actions:
      onRun:
        command: powershell
        args:
        - '{{Task.File.runRender}}'
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
    embeddedFiles:
    - name: runData
      filename: run-data.yaml
      type: TEXT
      data: |
        frame: {{Task.Param.Frame}}
    - name: runRender
      filename: render.bat
      type: TEXT
      runnable: true
      data: |
        3dsmax-openjd daemon run --connection-file {{ Session.WorkingDirectory }}/connection.json --run-data file://{{Task.File.runData}}
