specificationVersion: 'jobtemplate-2023-09'
name: VRay Tile Render
parameterDefinitions:
- name: VRayExecutable
  type: STRING
  default: vray
  description: V-Ray Standalone executable
- name: VRSceneOutputPath
  type: PATH
  objectType: FILE
  dataFlow: IN
  description: The vrscene file to render
- name: OutputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  description: Output directory for rendered images
- name: OutputFileName
  type: STRING
  description: Output filename with extension
- name: Frames
  type: STRING
  description: Frame range to render
- name: ImageWidth
  type: INT
  description: Image width in pixels
- name: ImageHeight
  type: INT
  description: Image height in pixels
- name: RegionColumns
  type: INT
  description: Number of tile columns
- name: RegionRows
  type: INT
  description: Number of tile rows
- name: RenderEngine
  type: INT
  default: 0
  allowedValues: [0, 5, 7]
  description: 'V-Ray render engine: 0=CPU, 5=CUDA, 7=RTX'
- name: RTTimeout
  type: FLOAT
  default: 0.0
  description: RT engine frame timeout in minutes (0=no limit)
- name: RTNoise
  type: FLOAT
  default: 0.001
  description: RT engine noise threshold
- name: RTSampleLevel
  type: INT
  default: 0
  description: RT engine max samples per pixel (0=no limit)
- name: CreateMovie
  type: STRING
  default: 'false'
  allowedValues:
  - 'true'
  - 'false'
- name: MovieFilename
  type: STRING
- name: FrameRate
  type: INT
steps:
- name: RenderRegions
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: '{{Param.Frames}}'
    - name: RegionCol
      type: INT
      range: '1-{{Param.RegionColumns}}'
    - name: RegionRow
      type: INT
      range: '1-{{Param.RegionRows}}'
  script:
    embeddedFiles:
    - name: RenderTile
      type: TEXT
      filename: render_tile.py
      data: INJECT_TILE_RENDER_SCRIPT
    actions:
      onRun:
        command: python
        args:
        - '{{Task.File.RenderTile}}'
- name: MergeRegions
  dependencies:
  - dependsOn: RenderRegions
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: '{{Param.Frames}}'
  script:
    embeddedFiles:
    - name: MergeTiles
      type: TEXT
      filename: merge_tiles.py
      data: INJECT_TILE_MERGE_SCRIPT
    actions:
      onRun:
        command: python
        args:
        - '{{Task.File.MergeTiles}}'
