specificationVersion: jobtemplate-2023-09
name: BatchRenderTest2024
description: null
parameterDefinitions:
- name: MaxSceneFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Max Scene File
    groupLabel: 3dsMax Settings
    fileFilters:
    - label: Max Scene Files
      patterns:
      - '*.max'
    - label: All Files
      patterns:
      - '*'
  description: The Max scene file to render.
- name: StrictErrorChecking
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Strict Error Checking
    groupLabel: 3dsMax Settings
  description: Fail when errors occur.
  default: 'false'
  allowedValues:
  - 'true'
  - 'false'
- name: B1_cam_only_Camera
