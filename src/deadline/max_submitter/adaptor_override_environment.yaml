specificationVersion: 'jobtemplate-2023-09'
parameterDefinitions:
- name: OverrideAdaptorWheels
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  description: A directory that contains wheels for openjd, deadline, and the overridden adaptor.
- name: OverrideAdaptorName
  type: STRING
  description: The name of the adaptor to override, for example 3dsmax-openjd.
environment:
  name: OverrideAdaptor
  description: >
    Replaces the default Adaptor in the environment's PATH with one from the
    packages in the OverrideAdaptorWheels attached directory.
  script:
    actions:
      onEnter:
        command: python3
        args:
          - '{{Env.File.SetupAdaptor}}'
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
    embeddedFiles:
    - name: SetupAdaptor
      filename: setup-adaptor.py
      type: TEXT
      runnable: true
      data: |
        # This content will be replaced by the external setup_adaptor_wheels.py file
        # during job bundle creation in create_job_bundle.py
        pass
