specificationVersion: 'jobtemplate-2023-09'
name: Default Max Job Template
description:
parameterDefinitions:
- name: MaxSceneFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Max Scene File
    groupLabel: 3dsMax Settings
    fileFilters:
    - label: Max Scene Files
      patterns:
      - '*.max'
    - label: All Files
      patterns:
      - '*'
  description: The Max scene file to render.
- name: StrictErrorChecking
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Strict Error Checking
    groupLabel: 3dsMax Settings
  description: Fail when errors occur.
  default: 'false'
  allowedValues:
  - 'true'
  - 'false'
steps:
- name: Render
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "{{Param.Frames}}"
  stepEnvironments:
    - name: 3ds Max
      description: Runs 3ds Max in the background.
      script:
        embeddedFiles:
          - name: initData
            filename: init-data.yaml
            type: TEXT
            data: |
              scene_file: {{Param.MaxSceneFile}}
          - name: runStart
            filename: start.bat
            type: TEXT
            data: |
              3dsmax-openjd daemon start --connection-file {{Session.WorkingDirectory}}/connection.json --init-data file://{{Env.File.initData}} --path-mapping-rules file://{{Session.PathMappingRulesFile}}
          - name: runStop
            filename: stop.bat
            type: TEXT
            data: |
              3dsmax-openjd daemon stop --connection-file {{Session.WorkingDirectory}}/connection.json
        actions:
          onEnter:
            command: powershell
            args:
              - '{{Env.File.runStart}}'
            cancelation:
              mode: NOTIFY_THEN_TERMINATE
            timeout: 87000
          onExit:
            command: powershell
            args:
              - '{{Env.File.runStop}}'
            cancelation:
              mode: NOTIFY_THEN_TERMINATE
            timeout: 600
  script:
    actions:
      onRun:
        command: powershell
        args:
        - '{{Task.File.runRender}}'
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
    embeddedFiles:
    - name: runData
      filename: run-data.yaml
      type: TEXT
      data: |
        frame: {{Task.Param.Frame}}
    - name: runRender
      filename: render.bat
      type: TEXT
      runnable: true
      data: |
        3dsmax-openjd daemon run --connection-file {{ Session.WorkingDirectory }}/connection.json --run-data file://{{Task.File.runData}}
